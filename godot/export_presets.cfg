; Presets de exportación para Godot 4.7.
; Configurado para generar dos APK Debug separados e instalables directamente en Android:
; - Android_arm64: exclusivo 64 bits (arm64-v8a).
; - Android_armv7: exclusivo 32 bits (armeabi-v7a).

[preset.0]

name="Android_arm64"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/android/iron_vector-arm64-v8a-debug.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/export_format=0
; Vacíos porque con use_gradle_build=false Godot 4.7 usa los valores de la plantilla oficial (minSdk 24 / targetSdk 36).
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.2.0-arm64-debug"
package/unique_name="com.indie.ironvector"
package/name="Iron Vector"
package/signed=true

