# Flujo de GitHub Actions EXCLUSIVAMENTE MANUAL (workflow_dispatch) para:
# 1. Descargar los modelos 3D (.glb) directamente desde GitHub Releases (no desde el repo).
# 2. Compilar el núcleo en Rust 1.100.0 (Debug) para Android 64-bit y 32-bit con caché.
# 3. Empaquetar el APK Debug usando Godot 4.7.2-stable headless.

name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      assets_tag:
        description: 'Tag del Release de assets 3D (vacío = usar el último Release)'
        required: false
        default: ''
        type: string

jobs:
  build-android-debug:
    name: Compilar Rust + Godot 4.7.2 (APK Debug)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GODOT_VERSION: "4.7.2-stable"
      GODOT_TEMPLATE_DIR: "4.7.2.stable"
      RUST_VERSION: "1.100.0"
      ANDROID_NDK_VERSION: "28.1.13356709"
      ANDROID_BUILD_TOOLS_VERSION: "35.0.1"
      ANDROID_PLATFORM_VERSION: "android-35"
      MIN_SDK_API: "24"
      APK_ARM64_OUTPUT: "build/android/iron_vector-arm64-v8a-debug.apk"
      APK_ARMV7_OUTPUT: "build/android/iron_vector-armeabi-v7a-debug.apk"

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      # 1. Descargar los modelos GLB desde GitHub Releases (con caché por Tag resuelto)
      - name: Resolver Tag de Release de Assets 3D
        id: resolve-assets
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.assets_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            RESOLVED_TAG="$INPUT_TAG"
          else
            RESOLVED_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
          fi

          if [ -z "$RESOLVED_TAG" ] || [ "$RESOLVED_TAG" = "null" ]; then
            echo "::error::No se encontró ningún GitHub Release con assets 3D. Ejecuta primero el Action 'Generate & Release Blender 3D Assets' indicando un Tag."
            exit 1
          fi
          echo "tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
          echo "Usando Release de assets: $RESOLVED_TAG"

      - name: Caché de assets 3D (.glb) del Release
        id: cache-release-assets
        uses: actions/cache@v4
        with:
          path: godot/assets/models
          key: release-glb-${{ steps.resolve-assets.outputs.tag }}

      - name: Descargar modelos .glb desde GitHub Release
        if: steps.cache-release-assets.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p godot/assets/models
          gh release download "${{ steps.resolve-assets.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.glb" \
            --dir godot/assets/models \
            --clobber
          ls -lh godot/assets/models

      # 2. Java 17 requerido por las herramientas de firma y exportación de Godot 4.7
      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Android SDK base y caché de NDK / Platform / Build-Tools
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Caché de Android NDK y SDK components
        id: cache-android-ndk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/platforms/${{ env.ANDROID_PLATFORM_VERSION }}
            ${{ env.ANDROID_HOME }}/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          key: ${{ runner.os }}-android-${{ env.ANDROID_NDK_VERSION }}-${{ env.ANDROID_PLATFORM_VERSION }}-${{ env.ANDROID_BUILD_TOOLS_VERSION }}

      - name: Instalar Android NDK, Platform y Build-Tools
        if: steps.cache-android-ndk.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" \
            "platforms;${{ env.ANDROID_PLATFORM_VERSION }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}"

      - name: Exportar ruta de Android NDK
        run: |
          NDK_DIR="${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${NDK_DIR}" >> $GITHUB_ENV

      # 4. Rust 1.100.0 con targets ARM64 (64 bits) y ARMv7 (32 bits) + caché Cargo
      - name: Configurar Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi

      - name: Caché de dependencias Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Instalar cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # 5. Ejecutar pruebas unitarias en Rust y compilar librerías (.so) Debug
      - name: Ejecutar tests unitarios y compilar núcleo Rust (Linux host + Android 64/32 bits)
        run: |
          NDK_PREBUILT="${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64"
          export CLANG_PATH="${NDK_PREBUILT}/bin/clang"
          export LIBCLANG_PATH="${NDK_PREBUILT}/lib"

          cd rust
          cargo test --lib
          cargo build
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            --platform ${{ env.MIN_SDK_API }} \
            -o ../godot/bin \
            build

      # 6. Caché del binario headless de Godot 4.7.2 y sus plantillas de exportación
      - name: Caché de Godot ${{ env.GODOT_VERSION }} y Export Templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}

      - name: Descargar Godot ${{ env.GODOT_VERSION }} y Export Templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip"
          unzip -q "Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip" -d ~/godot
          mv ~/godot/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          rm -f "Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}"
          mkdir -p "$TEMPLATE_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz"
          unzip -q "Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz" -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* "$TEMPLATE_DIR/"
          rm -rf /tmp/godot_templates "Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz"

      - name: Añadir Godot al PATH
        run: echo "$HOME/godot" >> $GITHUB_PATH

      # 7. Keystore de depuración y configuración headless de editor_settings-4.7.tres
      - name: Generar Debug Keystore y configurar Godot 4.7 para Android
        run: |
          mkdir -p ~/.android ~/.config/godot
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"${{ env.ANDROID_HOME }}\"" \
            "export/android/java_sdk_path = \"${{ env.JAVA_HOME }}\"" \
            "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > ~/.config/godot/editor_settings-4.7.tres

      # 8. Importar proyecto (registra .gdextension, .glb y .ogg) y exportar 2 APKs separados (64 y 32 bits)
      - name: Importar recursos y exportar APKs Debug separados (arm64-v8a y armeabi-v7a)
        run: |
          mkdir -p godot/build/android
          godot --headless --path godot --import
          godot --headless --verbose --path godot --export-debug "Android_arm64" "$GITHUB_WORKSPACE/godot/${{ env.APK_ARM64_OUTPUT }}"
          godot --headless --verbose --path godot --export-debug "Android_armv7" "$GITHUB_WORKSPACE/godot/${{ env.APK_ARMV7_OUTPUT }}"
          ls -lh godot/build/android

      # 9. Subir ambos APKs Debug como artefactos separados (.zip independientes)
      - name: Subir APK Debug 64 bits (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: iron-vector-android-debug-arm64-v8a
          path: godot/${{ env.APK_ARM64_OUTPUT }}
          if-no-files-found: error

      - name: Subir APK Debug 32 bits (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: iron-vector-android-debug-armeabi-v7a
          path: godot/${{ env.APK_ARMV7_OUTPUT }}
          if-no-files-found: error
