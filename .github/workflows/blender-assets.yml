# Flujo de GitHub Actions EXCLUSIVAMENTE MANUAL (workflow_dispatch) para ejecutar
# Blender 5.2.4 sin interfaz, generar los modelos 3D (.glb) y vistas previas (.png),
# y publicarlos automáticamente en un GitHub Release con el Tag indicado por el usuario.

name: Generate & Release Blender 3D Assets

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag del Release en GitHub (ej: assets-v0.1.0)'
        required: true
        default: 'assets-v0.1.0'
        type: string
      release_title:
        description: 'Título opcional del Release'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Marcar Release como pre-release'
        required: false
        default: false
        type: boolean

jobs:
  blender-assets-release:
    name: Generar Assets 3D y Publicar Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      BLENDER_MAJOR_MINOR: "5.2"
      BLENDER_VERSION: "5.2.4"

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      # 1. Librerías del sistema requeridas por el binario Linux de Blender
      - name: Instalar dependencias del sistema para Blender headless
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils libxi6 libgl1 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgomp1

      # 2. Caché de Blender portable para no re-descargarlo en futuras ejecuciones
      - name: Caché de Blender ${{ env.BLENDER_VERSION }}
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender-${{ env.BLENDER_VERSION }}
          key: ${{ runner.os }}-blender-${{ env.BLENDER_VERSION }}

      - name: Descargar Blender ${{ env.BLENDER_VERSION }}
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender-${{ env.BLENDER_VERSION }}
          curl -sL "https://download.blender.org/release/Blender${{ env.BLENDER_MAJOR_MINOR }}/blender-${{ env.BLENDER_VERSION }}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C ~/blender-${{ env.BLENDER_VERSION }} --strip-components=1
          rm -f /tmp/blender.tar.xz

      - name: Añadir Blender al PATH y verificar versión
        run: |
          echo "$HOME/blender-${{ env.BLENDER_VERSION }}" >> $GITHUB_PATH
          ~/blender-${{ env.BLENDER_VERSION }}/blender --version

      # 3. Ejecutar cada script Python independiente en Blender sin interfaz
      - name: Generar rifle clásico 7.62 (animaciones idle, fire y reload)
        run: blender --background --python scripts/blender/weapon_classic_rifle.py -- godot/assets/models/classic_assault_rifle.glb

      - name: Generar efecto de fogonazo (muzzle flash)
        run: blender --background --python scripts/blender/fx_muzzle_flash.py -- godot/assets/models/muzzle_flash_fx.glb

      - name: Generar proyectil y casquillo con caída animada
        run: blender --background --python scripts/blender/fx_bullet_and_casing.py

      - name: Generar escenario de ciudad destruida con coberturas
        run: blender --background --python scripts/blender/arena_ruined_city.py -- godot/assets/models/ruined_city_arena.glb

      - name: Generar granada de fragmentación táctica
        run: blender --background --python scripts/blender/weapon_frag_grenade.py -- godot/assets/models/frag_grenade.glb

      - name: Generar efecto 3D de explosión de granada
        run: blender --background --python scripts/blender/fx_grenade_explosion.py -- godot/assets/models/grenade_explosion_fx.glb

      - name: Renderizar capturas PNG de vista previa (Cycles CPU)
        run: blender --background --python scripts/blender/render_previews.py -- previews

      # 4. Crear o actualizar GitHub Release con el Tag especificado por el usuario
      - name: Publicar assets 3D (.glb) y previews (.png) en GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
          TITLE: ${{ inputs.release_title }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          RELEASE_TITLE="${TITLE:-Assets 3D ($TAG)}"
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              godot/assets/models/*.glb \
              previews/*.png \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              godot/assets/models/*.glb \
              previews/*.png \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes "Modelos 3D GLB y vistas previas PNG generados con Blender ${{ env.BLENDER_VERSION }} headless." \
              $PRERELEASE_FLAG
          fi

      # 5. Respaldar también como artefacto descargable en la pestaña Actions
      - name: Subir artefacto de respaldo
        uses: actions/upload-artifact@v4
        with:
          name: blender-3d-assets-${{ inputs.tag_name }}
          path: |
            godot/assets/models/*.glb
            previews/*.png
          if-no-files-found: error
